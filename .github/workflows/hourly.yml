name: hourly-refresh

# Refresco horario LIGERO del dashboard: ingesta incremental -> generar
# prediccion -> exportar docs/data/*.json. Sin reentreno, sin
# monitorizacion (eso es del job diario, ver daily.yml).
#
# Por que hace falta un job horario si el precio es una subasta diaria:
# hay dos cadencias distintas en los datos.
#   - precio_spot: OMIE publica las 24h de D+1 DE GOLPE (~13:00 CET). A
#     las 06:00 UTC el dia en curso ya esta completo -> no necesita
#     refresco horario.
#   - demanda_real y generacion T.Real: ESIOS las publica en continuo
#     (resolucion nativa de 5 min). Con solo el job diario se quedaban
#     congeladas a las 06:00 UTC y el grafico del dia en curso mostraba
#     unicamente las primeras horas hasta el dia siguiente.
#
# SI se llama a predict_and_log aqui (a diferencia del diseno original):
# sin esto, cualquier prediccion generada en un run horario se perdia en
# cuanto terminaba el job, porque electricidad.db (donde predict_and_log
# escribia) vive en la cache de Actions y este job no la guarda -- el
# siguiente run horario restauraba otra vez el snapshot de esta manana,
# sin rastro de lo predicho entre medias. predict_and_log ahora tambien
# escribe en docs/data/predictions_log.json (ver
# src/storage/predictions_log.py), que SI es durable porque se comitea a
# git en el mismo paso que el resto del dashboard.
#
# El cache de electricidad.db/models/ se RESTAURA pero no se guarda: pesa
# ~230MB y guardarlo 24 veces al dia agotaria el limite de 10GB de caches
# del repositorio en pocas horas. Cada ejecucion parte del snapshot que
# dejo el job diario e ingesta el hueco desde entonces (una peticion por
# indicador, ver update_indicator_incremental) -- correcto e idempotente.
# El modelo entrenado (models/) si necesita venir de esa cache para poder
# predecir aqui; reentrenarlo sigue siendo cosa exclusiva del job diario.

on:
  schedule:
    # a y 15 de cada hora: el minuto 0 es cuando GitHub tiene mas cola de
    # workflows programados y mas retrasos
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# comparte grupo con daily.yml: los dos hacen push a main, y si coinciden
# (a las 06:00 UTC lo hacen) deben encolarse, no pisarse
concurrency:
  group: forecasting-electrico-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # falla pronto y con un mensaje claro en vez de dejar que reviente
      # dentro de python con un traceback (ESIOSClient lanza al construirse)
      - name: Comprobar que existe el secret ESIOS_API_KEY
        env:
          ESIOS_API_KEY: ${{ secrets.ESIOS_API_KEY }}
        run: |
          if [ -z "$ESIOS_API_KEY" ]; then
            echo "::error::Falta el secret ESIOS_API_KEY. Configuralo en Settings -> Secrets and variables -> Actions -> New repository secret (nombre exacto: ESIOS_API_KEY). Tiene que ser un *secret*, no una *variable*."
            exit 1
          fi

      - name: Restaurar cache de datos y modelo (sin guardarlo)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/electricidad.db
            models/
          key: forecasting-electrico-state-
          restore-keys: |
            forecasting-electrico-state-

      # Sin bbdd restaurada, ingest_incremental no haria una ingesta
      # incremental: al no encontrar datos previos cae al backfill
      # completo desde 2014 (ver update_indicator_incremental), que tarda
      # ~1h y son miles de peticiones a ESIOS. Eso es trabajo del job
      # diario, no de uno que corre 24 veces al dia -- aqui se sale sin
      # hacer nada y ya se recuperara en el siguiente run cuando el
      # diario haya dejado cache.
      - name: Comprobar que el cache trajo la bbdd
        id: state
        run: |
          if [ -f data/electricidad.db ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin bbdd en cache (aun no ha corrido daily.yml, o la cache expiro). Se salta el refresco horario para no lanzar un backfill completo; lo hara el job diario."
          fi

      - if: steps.state.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Ingesta incremental
        if: steps.state.outputs.ready == 'true'
        env:
          ESIOS_API_KEY: ${{ secrets.ESIOS_API_KEY }}
        run: python -m scripts.ingest_incremental

      - name: Generar y guardar predicción (log persistente en git)
        if: steps.state.outputs.ready == 'true'
        run: python -m scripts.predict_and_log

      - name: Exportar datos del dashboard (docs/data/*.json)
        if: steps.state.outputs.ready == 'true'
        id: export_dashboard
        run: python -m scripts.export_dashboard_data

      - name: Commit del dashboard actualizado
        if: steps.state.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "Sin cambios en docs/data/, nada que comitear"
            exit 0
          fi
          git commit -m "Refresco horario del dashboard [skip ci]"
          # el job diario puede haber pusheado mientras corria este:
          # rebase antes de empujar en vez de fallar
          git pull --rebase origin main
          git push
